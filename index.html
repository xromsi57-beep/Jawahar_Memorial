<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jawahar Memorial Sikshansthan</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f4f7fc;
  color: #263449;
  line-height: 1.7;
}

/* Header Banner - Clear Background Image */
header {
  background: linear-gradient(rgba(10, 35, 75, 0.65), rgba(10, 35, 75, 0.65)), 
              url('school-bg.jpg') center/cover no-repeat;
  color: white;
  padding: 45px 15px;
  text-align: center;
  border-bottom: 3px solid #f4b942;
  image-rendering: -webkit-optimize-contrast;
}

header h1 {
  font-size: clamp(24px, 4vw, 38px);
  text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
  font-weight: 700;
  letter-spacing: 0.5px;
}

header p {
  font-size: 16px;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
}

/* Notice Ticker Bar */
.ticker-bar {
  background: #ffcc00;
  color: #0b2850;
  padding: 8px 15px;
  font-weight: bold;
  font-size: 14px;
  display: flex;
  align-items: center;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.ticker-title {
  background: #0b2850;
  color: #ffcc00;
  padding: 3px 10px;
  border-radius: 4px;
  margin-right: 12px;
  white-space: nowrap;
  font-size: 13px;
}

/* Navigation Bar */
nav {
  background: #0b2850;
  padding: 12px 15px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

nav a {
  color: white;
  text-decoration: none;
  margin: 6px 12px;
  display: inline-block;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s ease;
}

nav a:hover {
  color: #f4b942;
  transform: translateY(-1px);
}

/* Hero Section - Sharp Clear Background */
.hero {
  background: linear-gradient(rgba(13, 46, 90, 0.6), rgba(24, 82, 148, 0.6)), 
              url('school-bg.jpg') center/cover no-repeat;
  color: white;
  padding: 90px 20px;
  text-align: center;
  image-rendering: -webkit-optimize-contrast;
}

.hero h2 {
  color: #f4b942;
  font-size: clamp(28px, 5vw, 45px);
  margin-bottom: 15px;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
}

.hero p {
  margin: 10px auto 20px auto;
  max-width: 720px;
  font-size: 18px;
  line-height: 1.8;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
}

/* Buttons */
button, .btn {
  display: inline-block;
  background: #f4b942;
  color: #0b2850;
  border: none;
  padding: 12px 24px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
  text-decoration: none;
  margin: 6px 5px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

button:hover, .btn:hover {
  background: #ffffff;
  color: #0b2850;
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
}

.btn-secondary {
  background: transparent;
  color: #ffffff;
  border: 2px solid #f4b942;
}

.btn-secondary:hover {
  background: #f4b942;
  color: #0b2850;
}

}
